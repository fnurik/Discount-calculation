<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Корзина — Интернет-магазин со скидками</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-header">
  <div class="header-container">
    <div class="logo">
      <i class="fas fa-percent"></i>
      <span>SmartDiscount</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link"><i class="fas fa-store"></i> Каталог</a>
      <a href="cart.html" class="nav-link active"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCountHeader" class="cart-badge">0</span></a>
      <a href="rules.html" class="nav-link"><i class="fas fa-book-open"></i> Правила скидок</a>
    </div>
  </div>
</div>

<div class="page">
  <div class="cart-layout">
    <div class="cart-items-card">
      <h3 style="margin-bottom: 16px;"><i class="fas fa-boxes"></i> Товары в корзине</h3>
      <div id="cartItemsList"></div>
      <button id="clearCartBtn" class="btn-clear"><i class="fas fa-trash-alt"></i> Очистить корзину</button>
    </div>
    <div class="discount-card">
      <h3><i class="fas fa-calculator"></i> Калькулятор скидок</h3>
      
      <!-- Блок с автоматическим определением статуса -->
      <div id="autoStatusBlock" style="background: #e8f5e9; padding: 12px; border-radius: 20px; margin-bottom: 16px;">
        <div style="font-size: 13px; color: #2e7d32; margin-bottom: 8px;">
          <i class="fas fa-robot"></i> <strong>Автоопределение статуса</strong>
        </div>
        <div id="autoStatusDisplay" style="font-weight: 600; font-size: 15px;"></div>
        <div id="vipCheckInfo" style="font-size: 12px; color: #555; margin-top: 6px;"></div>
      </div>
      
      <label style="font-weight: 500;">Или выберите статус вручную:</label>
      <select id="customerStatusSelect" class="status-selector">
        <option value="new"> Новый клиент — 0%</option>
        <option value="regular"> Постоянный (3+ заказов) — 5%</option>
        <option value="vip"> VIP (сумма заказов ≥ 50 000₽) — 10%</option>
      </select>
      
      <div id="discountSummary">
        <div class="summary-line">Сумма заказа: <span id="cartSubtotal">0 ₽</span></div>
        <div class="summary-line">Скидка: <span id="discountPercentText">0%</span> → <span id="discountAmountText">0 ₽</span></div>
        <div class="summary-line total-line">Итоговая цена: <span id="finalTotal">0 ₽</span></div>
      </div>
      
      <button id="recalcDiscountBtn" style="background:#e8f5e9; color:#2e7d32; width:100%; padding:12px; border-radius:40px; border:none; font-weight:600; margin:10px 0;"><i class="fas fa-sync-alt"></i> Пересчитать скидку</button>
      <button id="checkoutBtn" class="btn-checkout"><i class="fas fa-credit-card"></i> Оформить заказ</button>
      <div class="footnote">*Скидка применяется автоматически. VIP-статус присваивается при общей сумме заказов от 50 000 ₽.</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="cart.js"></script>
</body>
</html>
