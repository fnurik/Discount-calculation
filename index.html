<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Каталог — Интернет-магазин со скидками</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-header">
  <div class="header-container">
    <div class="logo">
      <i class="fas fa-percent"></i>
      <span>SmartDiscount</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link active"><i class="fas fa-store"></i> Каталог</a>
      <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCountHeader" class="cart-badge">0</span></a>
      <a href="rules.html" class="nav-link"><i class="fas fa-book-open"></i> Правила скидок</a>
    </div>
  </div>
</div>

<div class="page">
  <div class="catalog-header">
    <h2><i class="fas fa-tags"></i> Товары</h2>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div class="category-filters" id="categoryFilters"></div>
      <select id="sortSelect" class="sort-select">
        <option value="name-asc">По названию (А-Я)</option>
        <option value="price-asc">Цена: по возрастанию</option>
        <option value="price-desc">Цена: по убыванию</option>
      </select>
    </div>
  </div>
  <div id="productsGrid" class="products-grid"></div>
</div>

<script src="data.js"></script>
<script src="catalog.js"></script>
</body>
</html>
